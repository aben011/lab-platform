apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  project: platform

  source:
    repoURL: https://github.com/aben011/lab-platform
    targetRevision: main
    path: cert-manager

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
