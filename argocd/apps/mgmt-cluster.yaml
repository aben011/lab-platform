apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-cluster
  namespace: argocd
spec:
  project: mgmt-cluster
  source:
    repoURL: https://github.com/aben011/lab-mgmt-cluster
    targetRevision: refs/heads/main
    path: .
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

