apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-controller
  namespace: argocd
spec:
  project: argocd-controller

  source:
    repoURL: https://github.com/aben011/lab-platform
    targetRevision: main
    path: argocd-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
