apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-infra
  namespace: argocd
spec:
  project: cluster-infra
  source:
    repoURL: https://github.com/aben011/lab-cluster-infra
    targetRevision: refs/heads/main
    path: overlays/mgmt
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

